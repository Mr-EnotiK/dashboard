<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Панель Управления</title>
    <script src="https://telegram.org"></script>
    <style>
        /* Базовые настройки и палитра */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #141822;
            color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-h-screen;
        }
        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 700;
            color: #7E8BA2;
            letter-spacing: 0.5px;
        }
        .status {
            font-size: 12px;
            background-color: #1E2533;
            color: #3B82F6;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }
        /* Карточки-контейнеры */
        .card {
            background-color: #1E2533;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #232B3B;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7E8BA2;
            font-weight: 600;
        }
        .card-subtitle {
            font-size: 12px;
            color: #3B82F6;
            font-weight: 500;
        }
        /* Строки метрик 6:7 и 8:9 */
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            padding-bottom: 10px;
        }
        .metric-row.border {
            border-bottom: 1px solid #2C374E;
        }
        .metric-label {
            color: #7E8BA2;
        }
        .metric-value {
            font-weight: 700;
            color: #ffffff;
            font-size: 16px;
        }
        /* Сетка плиток навигации */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: auto;
        }
        .btn {
            background-color: #1E2533;
            border: 1px solid #232B3B;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }
        .btn:active {
            background-color: #252F41;
        }
        .btn-active-border {
            border-color: #3B82F6;
            position: relative;
        }
        .btn-icon {
            font-size: 20px;
        }
        .btn-title {
            font-weight: 600;
            font-size: 14px;
            color: #ffffff;
            margin-top: 4px;
        }
        .btn-desc {
            font-size: 11px;
            color: #7E8BA2;
        }
        .badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #3B82F6;
            color: #ffffff;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 0 11px 0 8px;
        }
        /* Автономный SVG График продаж (Блок 1) */
        .chart-container {
            width: 100%;
            height: 140px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
        }
        .chart-svg {
            width: 100%;
            height: 120px;
        }
        .chart-labels {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            margin-top: 4px;
        }
        .chart-axis-label {
            font-size: 10px;
            color: #52627A;
        }
    </style>
</head>
<body>

    <!-- Заголовок -->
    <div class="header">
        <h1>ТЕРМИНАЛ ЗАКАЗОВ</h1>
        <span class="status">Online</span>
    </div>

    <!-- БЛОК 1: График продаж -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">Динамика продаж</span>
            <span class="card-subtitle">Топ месяцев</span>
        </div>
        <div class="chart-container">
            <!-- Рисуем элегантный сглаженный график через чистый SVG, независимый от библиотек -->
            <svg class="chart-svg" viewBox="0 0 600 120" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.25" />
                        <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.0" />
                    </linearGradient>
                </defs>
                <!-- Заливка под графиком -->
                <path d="M 0 120 L 0 80 Q 100 40 200 70 T 400 30 T 600 50 L 600 120 Z" fill="url(#grad)" />
                <!-- Основная синяя линия -->
                <path d="M 0 80 Q 100 40 200 70 T 400 30 T 600 50" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
            </svg>
            <div class="chart-labels">
                <span class="chart-axis-label">Май</span>
                <span class="chart-axis-label">Июн</span>
                <span class="chart-axis-label">Июл</span>
                <span class="chart-axis-label">Авг</span>
                <span class="chart-axis-label">Сен</span>
                <span class="chart-axis-label">Окт</span>
                <span class="chart-axis-label">Ноя</span>
            </div>
        </div>
    </div>

    <!-- СРЕДНИЙ БЛОК: Экспресс-статистика -->
    <div class="card">
        <div class="metric-row border">
            <span class="metric-label">Оборот (6):</span>
            <span class="metric-value">450 000 ₽ (7)</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Заказы (8):</span>
            <span class="metric-value">1 250 шт. (9)</span>
        </div>
    </div>

    <!-- СЕТКА НАВИГАЦИИ: Блоки 2, 3, 4, 5 -->
    <div class="grid">
        <!-- 2: Склад -->
        <div onclick="handleNav('склад')" class="btn">
            <span class="btn-icon">📦</span>
            <span class="btn-title">Склад (2)</span>
            <span class="btn-desc">Остатки и учет</span>
        </div>
        
        <!-- 3: Статистика -->
        <div onclick="handleNav('статистика')" class="btn">
            <span class="btn-icon">📊</span>
            <span class="btn-title">Статистика (3)</span>
            <span class="btn-desc">Полный анализ</span>
        </div>
        
        <!-- 4: Терминал заказов -->
        <div onclick="handleNav('терминал')" class="btn btn-active-border">
            <div class="badge">LIVE</div>
            <span class="btn-icon">💻</span>
            <span class="btn-title">Задания (4)</span>
            <span class="btn-desc">Список текущих</span>
        </div>
        
        <!-- 5: Настройки -->
        <div onclick="handleNav('настройки')" class="btn">
            <span class="btn-icon">⚙️</span>
            <span class="btn-title">Настройки (5)</span>
            <span class="btn-desc">Конфигурация</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        tg.setHeaderColor('#141822');
        tg.setBackgroundColor('#141822');

        function handleNav(target) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            tg.sendData("action_open_" + target);
        }
    </script>
</body>
</html>
